  <body>
    <div id="root"><p style="padding:20px;font-family:sans-serif;color:#888">Laden...</p></div>
    <script>
      // Clear stale service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(n) { caches.delete(n); });
          });
        }
      }
      window.onerror = function(msg, src, line, col, err) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;font-family:sans-serif">' +
          '<h2 style="color:red">Error</h2>' +
          '<pre style="font-size:12px;white-space:pre-wrap">' + msg + '\n' + (src||'') + ':' + line + '</pre></div>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        document.getElementById('root').innerHTML =
          '<div style="padding:20px;font-family:sans-serif">' +
          '<h2 style="color:red">Error</h2>' +
          '<pre style="font-size:12px;white-space:pre-wrap">' + (e.reason && e.reason.message || e.reason || 'Unknown') + '</pre></div>';
      });
    </script>
  </body>
</html>
